name: Bug report
description: Something in Gesso crashes or does not work as documented.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. If one matches, add your details there.

        **Do not report security vulnerabilities here.** Report them privately as described in [SECURITY.md](https://github.com/gesso-dev/gesso/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Gesso version
      description: A release version or a commit SHA.
      placeholder: 0.1.0 or 1a2b3c4
    validations:
      required: true
  - type: dropdown
    id: rid
    attributes:
      label: Runtime identifier (RID)
      description: Where the bug happens. Select all that apply.
      multiple: true
      options:
        - win-x64
        - win-arm64
        - linux-x64
        - linux-arm64
        - osx-arm64
        - osx-x64
        - Other (name it in the description)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system version
      placeholder: Windows 11 24H2, Ubuntu 24.04, macOS 15.5
  - type: dropdown
    id: run-mode
    attributes:
      label: Run mode
      description: Select both if the bug happens in both.
      multiple: true
      options:
        - JIT (dotnet run, debugger)
        - NativeAOT (published build)
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU backend and hardware
      description: For rendering bugs. The backend (Vulkan, D3D12 or Metal), the GPU and the driver version.
      placeholder: Vulkan, NVIDIA RTX 3060, driver 560.94
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest project or code snippet that shows the bug, and how to run it.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Console output, exception and stack trace. This field is formatted as code automatically.
      render: text